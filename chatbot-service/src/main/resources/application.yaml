spring:
  application:
    name: chatbot-service

  main:
    web-application-type: reactive

  ai:
    model:
      chat: ${CHATBOT_AI_PROVIDER:google-genai}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
          temperature: ${GEMINI_TEMPERATURE:0.3}
          max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:2048}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

chatbot:
  response-timeout: ${CHATBOT_RESPONSE_TIMEOUT:60s}
  memory:
    max-messages: ${CHATBOT_MEMORY_MAX_MESSAGES:20}
  listing:
    timeout: ${LISTING_SERVICE_TIMEOUT:3s}
    max-results: ${CHATBOT_LISTING_MAX_RESULTS:6}

server:
  port: ${CHATBOT_SERVICE_PORT:8090}
