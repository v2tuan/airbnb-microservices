server:
  port: 8082
  servlet:
    context-path: /users

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

spring:
  application:
    name: user-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://ep-long-art-admsxgi9-pooler.c-2.us-east-1.aws.neon.tech/user_db?user=neondb_owner&password=npg_Wre0B1zxgOod&sslmode=require&channelBinding=require}
    username: ${USER_DB_USERNAME:neondb_owner}
    password: ${USER_DB_PASSWORD:npg_Wre0B1zxgOod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${USER_DB_MAX_POOL_SIZE:${DB_MAX_POOL_SIZE:3}}
      minimum-idle: ${USER_DB_MIN_IDLE:${DB_MIN_IDLE:0}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

idp:
  url: ${IDP_URL:http://localhost:8080}
  client-id: ${USER_SERVICE_IDP_CLIENT_ID:user_service}
  client-secret: ${USER_SERVICE_IDP_CLIENT_SECRET:Vzg4aVN4v35o2HhDX0jsKcVX6mGN4c96}

services:
  listing-service:
    url: ${LISTING_SERVICE_URL:http://localhost:8081}
  rating-service:
    url: ${RATING_SERVICE_URL:http://localhost:8085}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
