server:
  port: 8081

spring:
  application:
    name: listing-service

  datasource:
    url: ${LISTING_DB_URL:jdbc:postgresql://ep-summer-cell-aoj8338q-pooler.c-2.ap-southeast-1.aws.neon.tech/listing_db?user=neondb_owner&password=npg_94bsAULVZBHE&sslmode=require&channelBinding=require}
    username: ${LISTING_DB_USERNAME:neondb_owner}
    password: ${LISTING_DB_PASSWORD:npg_94bsAULVZBHE}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${LISTING_DB_MAX_POOL_SIZE:${DB_MAX_POOL_SIZE:5}}
      minimum-idle: ${LISTING_DB_MIN_IDLE:${DB_MIN_IDLE:0}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

clients:
  rating-service:
    base-url: ${RATING_SERVICE_BASE_URL:http://localhost:8888}
  booking-service:
    base-url: ${BOOKING_SERVICE_BASE_URL:http://localhost:8086/bookings}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.listingservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
