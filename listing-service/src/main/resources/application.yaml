server:
  port: 8081
  servlet:
    context-path: /listing

spring:
  application:
    name: listing-service

  datasource:
    url: jdbc:postgresql://localhost:5432/listing_service
    username: postgres
    password: 1234567890
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/identity
          jwk-set-uri: http://localhost:8080/identity/.well-known/jwks.json

jwt:
  signerKey: "1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij"

# Logging
logging:
  level:
    root: INFO
    com.listingservice: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# File upload (for photos)
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 50MB
