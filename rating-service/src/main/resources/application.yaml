spring:
  application:
    name: rating-service

  datasource:
    url: ${RATING_DB_URL:jdbc:postgresql://ep-divine-math-a1lyqysl-pooler.ap-southeast-1.aws.neon.tech/listing_db?sslmode=require}
    username: ${RATING_DB_USERNAME:neondb_owner}
    password: ${RATING_DB_PASSWORD:npg_GnXE70sJUjmu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${RATING_DB_MAX_POOL_SIZE:${DB_MAX_POOL_SIZE:3}}
      minimum-idle: ${RATING_DB_MIN_IDLE:${DB_MIN_IDLE:0}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

app:
  gateway-base-url: ${APP_GATEWAY_BASE_URL:http://localhost:8888/api/v1}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

server:
  port: 8085
