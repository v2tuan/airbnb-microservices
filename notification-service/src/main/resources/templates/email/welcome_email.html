<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:30px 0;background-color:#f4f6f8;">
    <tr>
        <td align="center">

            <!-- Main Container -->
            <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.08);">

                <!-- Top Gradient Bar -->
                <tr>
                    <td style="height:6px;background:linear-gradient(90deg,#FF5A5F,#ff8a8f);"></td>
                </tr>

                <!-- Header -->
                <tr>
                    <td align="center" style="padding:25px;">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Airbnb_Logo_Bélo.svg"
                             width="110"
                             alt="Logo"
                             style="display:block;">
                    </td>
                </tr>

                <!-- Hero -->
                <tr>
                    <td>
                        <img src="https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"
                             width="100%"
                             alt="Welcome"
                             style="display:block;">
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:35px 30px;color:#333333;">

                        <h1 style="margin:0 0 10px;font-size:26px;font-weight:600;">
                            Welcome, <span th:text="${firstName}"></span> 👋
                        </h1>

                        <p style="margin:0 0 15px;font-size:16px;color:#555;">
                            Hi <b th:text="${firstName}"></b> <b th:text="${lastName}"></b>,
                        </p>

                        <p style="margin:0 0 25px;font-size:15px;line-height:1.6;color:#666;">
                            We're thrilled to have you on board. Discover amazing experiences, connect with people, and start your journey with us today.
                        </p>

                        <!-- CTA -->
                        <table cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="border-radius:8px;background:linear-gradient(90deg,#FF5A5F,#ff7a7f);">
                                    <a th:href="${actionUrl}"
                                       style="display:inline-block;padding:14px 24px;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;">
                                        🚀 Get Started
                                    </a>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>

                <!-- Divider -->
                <tr>
                    <td style="padding:0 30px;">
                        <hr style="border:none;border-top:1px solid #eeeeee;">
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="padding:20px 30px;text-align:center;font-size:13px;color:#999;line-height:1.5;">
                        <p style="margin:0;">
                            © <span th:text="${#temporals.year(#temporals.createNow())}"></span> Airbnb
                        </p>
                        <p style="margin:5px 0;">
                            You received this email because you signed up.
                        </p>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
