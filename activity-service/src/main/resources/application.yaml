server:
  port: 8089

spring:
  application:
    name: activity-service
  datasource:
    url: ${ACTIVITY_DB_URL:jdbc:postgresql://ep-divine-math-a1lyqysl-pooler.ap-southeast-1.aws.neon.tech/activity_db?sslmode=require}
    username: ${ACTIVITY_DB_USERNAME:neondb_owner}
    password: ${ACTIVITY_DB_PASSWORD:npg_GnXE70sJUjmu}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${ACTIVITY_DB_MAX_POOL_SIZE:${DB_MAX_POOL_SIZE:3}}
      minimum-idle: ${ACTIVITY_DB_MIN_IDLE:${DB_MIN_IDLE:0}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
