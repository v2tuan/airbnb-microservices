server:
  port: 8087
  servlet:
    context-path: /payments

spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://ep-divine-math-a1lyqysl-pooler.ap-southeast-1.aws.neon.tech/payment_db?sslmode=require
    username: neondb_owner
    password: npg_GnXE70sJUjmu
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  cache:
    type: ${CACHE_TYPE:simple}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: payment-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/airbnb

logging:
  level:
    root: INFO
    com.paymentservice: DEBUG

idp:
  url: http://localhost:8080
  client-id: payment_service
  client-secret: by2n65zqJJrNemDHwVRSiOtl3f5CwdgK


# ===== STRIPE CONFIG =====
stripe:
  # Secret key - dùng test key khi develop
  secret-key: ${STRIPE_SECRET_KEY:}

  # Webhook secret - lấy từ Stripe CLI hoặc Stripe Dashboard
  # Chạy: stripe listen --forward-to localhost:8080/webhook
  # CLI sẽ hiện: "webhook signing secret: whsec_..."
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # Publishable key - dùng ở Frontend (an toàn để expose)
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:}

kafka:
  topics:
    payment-succeeded: payment.succeeded
    payout-completed: payout.completed
    refund-completed: refund.completed
    refund-failed: refund.failed

payout:
  scheduler-delay-ms: ${PAYOUT_SCHEDULER_DELAY_MS:60000}

payment:
  reconciliation:
    enabled: ${PAYMENT_RECONCILIATION_ENABLED:false}
    delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:3600000}
