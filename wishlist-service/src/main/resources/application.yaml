server:
  port: 8083

spring:
  application:
    name: wishlist-service

  datasource:
    url: ${WISHLIST_DB_URL:jdbc:postgresql://ep-long-art-admsxgi9-pooler.c-2.us-east-1.aws.neon.tech/wishlist_db?user=neondb_owner&password=npg_Wre0B1zxgOod&sslmode=require&channelBinding=require}
    username: ${WISHLIST_DB_USERNAME:neondb_owner}
    password: ${WISHLIST_DB_PASSWORD:npg_Wre0B1zxgOod}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${WISHLIST_DB_MAX_POOL_SIZE:${DB_MAX_POOL_SIZE:3}}
      minimum-idle: ${WISHLIST_DB_MIN_IDLE:${DB_MIN_IDLE:0}}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:900000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:300000}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

jwt:
  signerKey: ${JWT_SIGNER_KEY:1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij}

logging:
  level:
    root: INFO
    com.wishlistservice: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
