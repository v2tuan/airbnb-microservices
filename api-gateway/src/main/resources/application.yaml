server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/airbnb
  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: user_service
            uri: http://localhost:8082
            predicates:
              - Path=${app.api-prefix}/users/**
            filters:
              - StripPrefix=2
