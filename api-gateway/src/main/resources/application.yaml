server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/airbnb

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                  - "http://localhost:3001"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

          routes:
            - id: profile_service
              uri: lb://user-service
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2
                - PrefixPath=/users
            - id: user_service
              uri: lb://user-service
              predicates:
                - Path=${app.api-prefix}/users/**
              filters:
                - StripPrefix=2
#                - PrefixPath=/users
            - id: listing_service
              uri: lb://listing-service
              predicates:
                - Path=${app.api-prefix}/listings/**
              filters:
                - StripPrefix=2
            - id: rating_service
              uri: lb://rating-service
              predicates:
                - Path=${app.api-prefix}/ratings/**
              filters:
                - StripPrefix=2
            - id: wishlist_service
              uri: lb://wishlist-service
              predicates:
                - Path=${app.api-prefix}/wishlist/**
              filters:
                - StripPrefix=2
            - id: payment_service
              uri: lb://payment-service
              predicates:
                - Path=${app.api-prefix}/payments/**
              filters:
                - StripPrefix=2
            - id: message_service
              uri: http://localhost:8017
              predicates:
                - Path=${app.api-prefix}/conversations/**,${app.api-prefix}/messages/**
              filters:
                - StripPrefix=2
                - PrefixPath=/V1
            - id: booking_service
              uri: lb://booking-service
              predicates:
                - Path=${app.api-prefix}/bookings/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
