server:
  port: 8888

app:
  api-prefix: /api/v1
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:3001}

gateway:
  downstream:
    connect-timeout-ms: ${GATEWAY_DOWNSTREAM_CONNECT_TIMEOUT_MS:3000}
    response-timeout-seconds: ${GATEWAY_DOWNSTREAM_RESPONSE_TIMEOUT_SECONDS:15}
    pending-acquire-timeout-seconds: ${GATEWAY_DOWNSTREAM_PENDING_ACQUIRE_TIMEOUT_SECONDS:5}
spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/airbnb}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/airbnb/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://localhost:3000,http://localhost:3001}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers:
                  - "*"
                allow-credentials: true
                max-age: 3600

          routes:
            - id: profile_service
              uri: lb://user-service
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2
                - PrefixPath=/users
            - id: user_service
              uri: lb://user-service
              predicates:
                - Path=${app.api-prefix}/users/**
              filters:
                - StripPrefix=2
#                - PrefixPath=/users
            - id: listing_service
              uri: lb://listing-service
              predicates:
                - Path=${app.api-prefix}/listings/**
              filters:
                - StripPrefix=2
            - id: rating_service
              uri: lb://rating-service
              predicates:
                - Path=${app.api-prefix}/ratings/**
              filters:
                - StripPrefix=2
            - id: wishlist_service
              uri: lb://wishlist-service
              predicates:
                - Path=${app.api-prefix}/wishlist/**
              filters:
                - StripPrefix=2
            - id: payment_service
              uri: lb://payment-service
              predicates:
                - Path=${app.api-prefix}/payments/**
              filters:
                - StripPrefix=2
            - id: message_service
              uri: ${MESSAGE_SERVICE_URI:http://localhost:8017}
              predicates:
                - Path=${app.api-prefix}/conversations/**,${app.api-prefix}/messages/**
              filters:
                - StripPrefix=2
                - PrefixPath=/V1
            - id: message_socket
              uri: ${MESSAGE_SERVICE_WS_URI:ws://localhost:8017}
              predicates:
                - Path=/socket.io/**
            - id: notification_service
              uri: lb://notification-service
              predicates:
                - Path=${app.api-prefix}/notification/**
              filters:
                - StripPrefix=2
            - id: booking_service
              uri: lb://booking-service
              predicates:
                - Path=${app.api-prefix}/bookings/**
              filters:
                - StripPrefix=2
            - id: chatbot_service
              uri: lb://chatbot-service
              predicates:
                - Path=${app.api-prefix}/chatbot/**
              filters:
                - StripPrefix=2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
